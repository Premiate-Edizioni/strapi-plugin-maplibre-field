name: CI

# Runs on every push to main and on every PR. publish.yml also runs the test matrix, but only
# on version tags: without this workflow a breakage is discovered during a release, not before.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and formatting are version-independent, so they run once instead of per Node version.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      # Pin npm instead of taking whatever each Node ships (22 -> npm 10, 24/26 -> npm 11).
      # `npm ci` refuses to install when the lockfile's tree is not the one it would compute,
      # and npm 10 and 11 do not always hoist identically, so a lockfile written on one and
      # read on the other can fail before a single test runs. The matrix is here to test our
      # code on three Node versions, not to test npm against itself.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported range declared in package.json engines (>=22 <=26), matching what
        # @strapi/strapi 5 itself declares. Node 26 is blocking here, on push and PRs, so a
        # break surfaces while working rather than during a release; publish.yml deliberately
        # keeps a narrower matrix, see the comment there.
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Pin npm instead of taking whatever each Node ships (22 -> npm 10, 24/26 -> npm 11).
      # `npm ci` refuses to install when the lockfile's tree is not the one it would compute,
      # and npm 10 and 11 do not always hoist identically, so a lockfile written on one and
      # read on the other can fail before a single test runs. The matrix is here to test our
      # code on three Node versions, not to test npm against itself.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test
