name: Publish to npm

# Runs on every version tag (e.g. v1.4.0). Publishing uses npm Trusted Publishing (OIDC):
# no npm token or 2FA prompt involved, only what's configured for this workflow on npmjs.com
# (Package settings -> Trusted Publisher). See docs/CONTRIBUTING for the release process.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to mint the OIDC token for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v6
      # No registry-url here: actions/setup-node writes an (empty) NODE_AUTH_TOKEN-based
      # .npmrc entry whenever it's set, which npm tries before falling back to OIDC and
      # turns into a bare 404 once that empty token is rejected.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      # Node 22 bundles an npm older than the 11.5.1 minimum Trusted Publishing needs; without
      # this, npm publish falls back to a plain unauthenticated request (404 from the registry).
      - run: npm install -g npm@latest
      - run: npm --version
      # --provenance is what makes npm negotiate the OIDC exchange for Trusted Publishing;
      # --access public is required the first time a scoped package is published.
      - run: npm publish --provenance --access public
