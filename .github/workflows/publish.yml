name: Publish to npm

# Runs on every version tag (e.g. v1.4.0). Publishing uses npm Trusted Publishing (OIDC):
# no npm token or 2FA prompt involved, only what's configured for this workflow on npmjs.com
# (Package settings -> Trusted Publisher). See docs/CONTRIBUTING for the release process.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Narrower than package.json engines and than ci.yml, on purpose: publish needs this job,
      # so a failure here blocks the release itself. Node 26 stays out until it becomes LTS in
      # October 2026 — while it is Current, an upstream regression in a minor would block a
      # publish rather than a PR. ci.yml already runs 26 as a blocking job on every push and PR,
      # so the same commit is covered before it ever reaches a tag. Add '26' here once it is LTS.
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # Same pin as ci.yml, and for the same reason: see the comment there.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required to mint the OIDC token for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Node 24, not 22: several reports on npm/cli#8730 show the OIDC token exchange failing on
      # Node 22 even with npm upgraded past the 11.5.1 minimum, and succeeding on 24.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Before `npm ci`, not after: this is the same pin the other jobs use, and it doubles as
      # the npm upgrade Trusted Publishing needs (npm/cli#8730 puts the minimum at 11.5.1).
      # Pinned rather than @latest so a future npm 12 cannot change the install behaviour of a
      # release without anyone deciding to.
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm --version
      # --provenance is required the first time a package is published from a given repository
      # (npm/cli#8730); without it the token exchange answers "package not found".
      - run: npm publish --provenance --access public
