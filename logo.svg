<!--
  Logo di MapLibre Field. Sorgente: modificarlo qui, non ritoccare il PNG.
  Rigenerare logo.png con:  inkscape logo.svg -o logo.png -w 512 -h 512
  (oppure con qualsiasi rasterizzatore: e' un SVG 512x512 senza dipendenze esterne)

  IL DISEGNO
  Il marchio MapLibre ufficiale in alto a sinistra - pin e barretta, path intatti dal logo
  quadrato di maplibre.org - e sotto le righe di un form. La prima riga non ha etichetta:
  e' il campo che il pin sopra riempie. Le due sotto sono gli altri campi del content type.

  DUE MISURE DA NON ROMPERE
  La barretta del marchio e le etichette del form sono la stessa specie visiva (piccoli
  rettangoli arrotondati), quindi la barretta rischia di smettere di appartenere al marchio
  e di leggersi come la prima riga del form. Lo impediscono due cose insieme:
    - in verticale, il vuoto sopra la prima etichetta e' 78px contro i 18px fra una riga
      e l'altra, cioe' 4,3 volte
    - in orizzontale, le etichette (147-216) partono dove finisce la barretta (88-156):
      a scaletta, non incolonnate
  Basta uno dei due, ma sono entrambi presenti. Uniformare quelle spaziature "per pulizia"
  rompe il logo in un modo che poi e' difficile diagnosticare.

  PERCHE' IL GRADIENTE STA SOLO SUL FONDO
  Una versione con il gradiente anche sul contenuto e' stata provata e scartata. Il marchio
  sta in alto e le righe del form in basso, quindi un gradiente verticale sul contenuto da'
  il tono piu' debole al marchio e il piu' forte alle righe: gerarchia invertita. Misurato
  in luminanza sui quattro elementi: 96,1 / 83,8 / 79,6 / 70,3 dal pin all'ultima barra,
  con l'elemento sbagliato a vincere. Qui il contenuto resta tutto su #4945ff e la
  profondita' la porta il fondo, che e' l'unica superficie senza compito semantico.

  Il gradiente usa gradientUnits="userSpaceOnUse" sull'intero canvas.

  I margini sono 45/45 orizzontali e 39/39 verticali: la traslazione translate(8.7653541)
  sul gruppo del contenuto serve a pareggiare i due margini laterali.
-->
